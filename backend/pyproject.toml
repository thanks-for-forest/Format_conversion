[project]
name = "format-conversion-backend"
version = "0.1.0"
description = "文件格式转换站点后端"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.115",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.19.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
