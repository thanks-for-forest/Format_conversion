repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: backend/.venv/Scripts/python.exe -m mypy
        language: system
        pass_filenames: false
        files: ^backend/(app|tests)/.*\.py$
        args: [--config-file, backend/pyproject.toml, backend/app]